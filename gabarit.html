  :root{
    --bg:#f6f2ea; --bg-raised:#fffdf9; --ink:#2a2420; --ink-soft:#6b6058; --line:#ddd3c4;
    --accent:#b5652c; --good:#4c7a52; --good-bg:#e3ecdf; --warn:#a6791f; --warn-bg:#f1e6c9;
    --miss:#e4dccf; --quiet:#8c8378;
  }
  @media (prefers-color-scheme: dark) {
    :root{
      --bg:#1d1a17; --bg-raised:#27231f; --ink:#ece5da; --ink-soft:#b0a596; --line:#3d362f;
      --accent:#d98a4e; --good:#7fb287; --good-bg:#263329; --warn:#d4a94a; --warn-bg:#3a3220;
      --miss:#37312b; --quiet:#857b6f;
    }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:'Luciole', system-ui, sans-serif; font-size:17px; line-height:1.55; }
  main{ max-width:46rem; margin:0 auto; padding:1.5rem 1rem 3rem; }
  header h1{ font-family:'Newsreader', Georgia, serif; font-weight:600; font-size:2.2rem; margin:0; }
  header p{ margin:.2rem 0 1.5rem; color:var(--ink-soft); }
  .carte{ background:var(--bg-raised); border:1px solid var(--line); border-radius:10px;
    padding:1rem 1.1rem; margin-bottom:1rem; }
  .carte h2{ font-family:'Newsreader', Georgia, serif; font-weight:500; font-size:1.3rem; margin:0 0 .3rem; }
  .etat{ display:inline-block; padding:.1rem .6rem; border-radius:999px; font-size:.85rem; }
  .etat.fait{ background:var(--good-bg); color:var(--good); }
  .etat.a-faire{ background:var(--warn-bg); color:var(--warn); }
  .etat.plus-tard{ background:var(--miss); color:var(--ink-soft); }
  #avis{ display:block; border-radius:.5rem; margin:.4rem 0 0; }
  #avis[hidden]{ display:none; }
  .chiffres{ display:flex; flex-wrap:wrap; gap:.4rem 1.6rem; align-items:baseline; margin:.7rem 0; }
  .serie b{ font-family:'IBM Plex Mono', monospace; font-weight:500; font-size:2.4rem; color:var(--accent); line-height:1; }
  .chiffres span{ color:var(--ink-soft); }
  .chiffres span b{ font-family:'IBM Plex Mono', monospace; font-weight:500; color:var(--ink); }
  .grille{ display:grid; grid-template-rows:repeat(7, 11px); grid-auto-flow:column; grid-auto-columns:11px;
    gap:3px; overflow-x:auto; padding-bottom:.3rem; }
  .grille i{ border-radius:2px; }
  .grille .fait{ background:var(--good); }
  .grille .manque{ background:var(--miss); }
  .grille .neutre{ background:var(--miss); opacity:.35; }
  .grille .attente{ background:transparent; outline:1px dashed var(--quiet); outline-offset:-1px; }
  details{ margin-top:.6rem; color:var(--ink-soft); font-size:.9rem; }
  summary{ cursor:pointer; }
</style>
</head>
<body>
<main>
  <header>
    <h1>koti</h1>
    <p id="resume"></p>
    <p id="avis" class="etat plus-tard" hidden></p>
  </header>
  <div id="rituels"></div>
</main>
<script type="application/json" id="data-source">
{}
</script>
<script>
const data = JSON.parse(document.getElementById('data-source').textContent);

function esc(valeur) {
  return String(valeur).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function jours(n) { return n + (n > 1 ? ' jours' : ' jour'); }
function pourcent(paire) { return paire[1] ? Math.round(100 * paire[0] / paire[1]) + ' %' : '—'; }

function dateLocale() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// Page générée un jour antérieur : l'état affiché est celui de la date de génération, pas celui d'aujourd'hui.
const perimee = Boolean(data.aujourdhui) && data.aujourdhui !== dateLocale();
const jourCourt = data.aujourdhui ? data.aujourdhui.slice(8, 10) + '/' + data.aujourdhui.slice(5, 7) : '';

function etat(t) {
  if (perimee) {
    if (t.fait_aujourdhui) return `<span class="etat fait">fait le ${esc(jourCourt)}${t.heure_du_jour ? ' à ' + esc(t.heure_du_jour) : ''}</span>`;
    // Rituel sans série : jamais de constat « non fait ».
    if (t.sans_serie) return '';
    return `<span class="etat plus-tard">non fait le ${esc(jourCourt)}</span>`;
  }
  if (t.fait_aujourdhui) return `<span class="etat fait">fait${t.heure_du_jour ? ' à ' + esc(t.heure_du_jour) : ''}</span>`;
  if (t.cochable) return '<span class="etat a-faire">à faire</span>';
  return `<span class="etat plus-tard">pas avant ${esc(t.heure_fixe)}</span>`;
}

function grille(calendrier) {
  if (!calendrier.length) return '';
  const decalage = (new Date(calendrier[0][0] + 'T00:00:00').getDay() + 6) % 7;
  const cases = calendrier.map(([jour, e]) => `<i class="${esc(e)}" title="${esc(jour)}"></i>`).join('');
  return `<div class="grille">${'<i></i>'.repeat(decalage)}${cases}</div>`;
}

function carte(t) {
  const moyenne = t.heure_moyenne
    ? `<span>en moyenne à <b>${esc(t.heure_moyenne)}</b> (sur ${esc(t.nb_heures)})</span>` : '';
  // Rituel sans série : ni série, ni record, ni pourcentage, seulement le nombre de sessions.
  const chiffres = t.sans_serie
    ? `<span class="serie"><b>${esc(t.total)}</b> ${t.total > 1 ? 'sessions' : 'session'}</span>
      ${moyenne}`
    : `<span class="serie"><b>${esc(t.serie)}</b> ${t.serie > 1 ? 'jours' : 'jour'} de série</span>
      <span>record <b>${esc(jours(t.record))}</b></span>
      <span>7 j <b>${pourcent(t.taux.sept)}</b></span>
      <span>30 j <b>${pourcent(t.taux.trente)}</b></span>
      <span>depuis le début <b>${pourcent(t.taux.tout)}</b></span>
      ${moyenne}`;
  return `<section class="carte">
    <h2>${esc(t.titre)}</h2>
    ${etat(t)}
    <div class="chiffres">
      ${chiffres}
    </div>
    ${grille(t.calendrier)}
    ${t.notes ? `<details><summary>Notes</summary>${esc(t.notes)}</details>` : ''}
  </section>`;
}

if (data.genere_le) {
  const quand = data.genere_le.replace('T', ' à ').slice(0, 18);
  document.getElementById('resume').textContent = perimee
    ? `État au ${data.aujourdhui} · ${data.faites_aujourdhui} sur ${data.suivis} faites ce jour-là · généré le ${quand}`
    : `${data.faites_aujourdhui} sur ${data.suivis} faites aujourd'hui · généré le ${quand}`;
}
if (perimee) {
  const avis = document.getElementById('avis');
  avis.textContent = "Cette page n'a pas été régénérée aujourd'hui : l'état et les séries affichés sont ceux du " + data.aujourdhui + '.';
  avis.hidden = false;
}
document.getElementById('rituels').innerHTML = data.taches.map(carte).join('');
</script>
</body>
</html>
